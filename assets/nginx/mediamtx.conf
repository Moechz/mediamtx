# MediaMTX for TOS 7 — nginx 路由（WebUI External Open / 新标签页）
# 安装位置: /usr/local/mediamtx/nginx/mediamtx.conf（平台加载）
#           /etc/nginx/conf.d/mediamtx.conf（postinst 兜底双落盘）
# 规范: 只允许 location 块，禁止 server {} 块；location 前缀与 config.ini 的 path 一致。
#
# 组成：
#   1) /mediamtx/          → 状态控制台静态页（webui.bz2 由 postinst 解压到 /usr/local/mediamtx/）
#   2) /mediamtx/api/      → 管理 API（MediaMTX 仅监听 127.0.0.1:9997）
#   3) /mediamtx/hls/      → HLS 播放（MediaMTX 监听 :8888，浏览器经网关观看）
#   媒体推拉流端口（RTSP/RTMP/WebRTC/SRT）不走网关，直接由客户端连接。

# 1) 状态控制台（静态文件；webui.bz2 解压物）
location /mediamtx/ {
    alias /usr/local/mediamtx/;
    index index.html;
    # 坑 13：301 输出相对 Location，避免 TOS 非标准 web 端口（8181/5443）被丢掉
    absolute_redirect off;
    add_header Cache-Control "no-cache" always;
}

# 2) 管理 API 反向代理（剥前缀：/mediamtx/api/v3/... → /v3/...）
location /mediamtx/api/ {
    proxy_pass http://127.0.0.1:9997/;
    absolute_redirect off;
    proxy_http_version 1.1;
    # 坑 14：含端口；便于后端按 Host 生成绝对链接
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# 3) HLS 播放（剥前缀：/mediamtx/hls/<path>/... → /<path>/...）
#    MediaMTX 自带播放页（/<path>/）与其相对资源（hls.min.js、index.m3u8）
location /mediamtx/hls/ {
    proxy_pass http://127.0.0.1:8888/;
    absolute_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # 低延迟 HLS 用分块传输，禁用缓冲更顺
    proxy_buffering off;
}

# 4) 无尾斜杠访问补 301（容错）
location = /mediamtx {
    absolute_redirect off;
    return 301 /mediamtx/;
}
